name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ручной передеплой main (например, после правки deploy/*.env на сервере).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      # Сьют api ходит в настоящий Postgres: сам создаёт базу *_test и
      # накатывает миграции (api/src/test/globalSetup.ts).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ximi4ka_shop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run format:check
      - run: bash deploy/ci-deploy.test.sh

  # Выкатка на new.ximi4ka.ru — только main и только после зелёного ci.
  # Ключ из DEPLOY_SSH_KEY на сервере привязан к deploy/ci-deploy.sh (forced
  # command): он умеет лишь выкатить переданный SHA из main. Настройка — в
  # deploy/README.md, раздел «Автодеплой».
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://new.ximi4ka.ru
    # Выкатки идут строго по одной; новая ждёт, а не отменяет текущую.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Выкатка через ssh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
